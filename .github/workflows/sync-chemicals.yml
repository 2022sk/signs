name: 화학물질 목록 동기화

on:
  schedule:
    - cron: '7 * * * *'   # 매시 7분 (GitHub 사정에 따라 몇 분 늦을 수 있음)
  workflow_dispatch:       # Actions 탭에서 [Run workflow]로 바로 갱신

permissions:
  contents: write

concurrency:
  group: sync-chemicals
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography
      - name: chemicare에서 목록 받기
        env:
          CHEMICARE_URL: ${{ secrets.CHEMICARE_URL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python3 scripts/fetch_chemicals.py chemicals.enc.json
      - name: 바뀐 내용이 있으면 커밋
        run: |
          if [ -z "$(git status --porcelain -- chemicals.enc.json)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add chemicals.enc.json
          git commit -m "Update chemicals list"
          git push
